name: build
on:
  push:
    branches: [pc_tools2]
    tags:
      - "v*"
      - "V*"
permissions:
  contents: write
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - name: 拉取项目代码
        uses: actions/checkout@v4

      - name: 安装node环境
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装pnpm
        uses: pnpm/action-setup@v4
        id: pnpm-install
        with:
          run_install: false

      - name: 获取pnpm仓库目录
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: 设置pnpm缓存
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: 安装Python3环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: "pip"

      - name: 初始化打包环境
        run: pnpm run init

      - name: 开始打包
        run: pnpm run build

      - name: 上传打包完成的程序包
        uses: actions/upload-artifact@v4
        with:
          name: Setup_${{ runner.os }}
          retention-days: 1
          path: build/*-*_*.*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 下载全部构建产物
        uses: actions/download-artifact@v4
        with:
          path: packages

      - name: 收集产物列表
        id: artifacts
        run: |
          FILE_LIST=$(find packages -type f -print)
          if [ -z "$FILE_LIST" ]; then
            echo "未找到可上传的文件" >&2
            exit 1
          fi
          echo "$FILE_LIST"
          printf "files<<EOF\n%s\nEOF\n" "$FILE_LIST" >> $GITHUB_OUTPUT

      - name: 解析标签信息
        id: tag_meta
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

          # 约定：带预发布后缀的 tag 作为测试版（如 v1.2.3-beta.1 / v1.2.3-rc.1）
          if [[ "$TAG_NAME" == *-* ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

          git tag -l --format='%(contents)' "$TAG_NAME" > release_notes.md
          if [ ! -s release_notes.md ]; then
            git log -1 --pretty=%B > release_notes.md
          fi
          echo "body_path=release_notes.md" >> $GITHUB_OUTPUT

      - name: 发布到 GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.artifacts.outputs.files }}
          body_path: ${{ steps.tag_meta.outputs.body_path }}
          tag_name: ${{ steps.tag_meta.outputs.tag_name }}
          prerelease: ${{ steps.tag_meta.outputs.prerelease == 'true' }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.PPX_GITHUB_TOKEN }}

      - name: 清理超量测试版 Release（最多保留 5 个）
        if: steps.tag_meta.outputs.prerelease == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PPX_GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner
            const repo = context.repo.repo

            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner,
              repo,
              per_page: 100
            })

            const prereleases = releases
              .filter(r => r.prerelease && !r.draft)
              .sort((a, b) => new Date(a.created_at) - new Date(b.created_at))

            const keep = 5
            const overflow = prereleases.length - keep

            if (overflow <= 0) {
              core.info(`当前测试版 Release 共 ${prereleases.length} 个，无需清理`) 
              return
            }

            const toDelete = prereleases.slice(0, overflow)
            for (const rel of toDelete) {
              core.info(`删除测试版 Release: ${rel.name || rel.tag_name} (#${rel.id})`)
              await github.rest.repos.deleteRelease({
                owner,
                repo,
                release_id: rel.id
              })
            }

            core.info(`已清理 ${toDelete.length} 个旧测试版 Release，保留最新 ${keep} 个`)
