<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">PPX 多功能工具箱</title>
  <desc id="desc">四个互锁模块围成工具箱，中央留出加号负形。</desc>
  <defs>
    <mask id="handle-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#000" />
      <rect x="318" y="72" width="388" height="300" rx="100" fill="#fff" />
      <rect x="398" y="152" width="228" height="160" rx="48" fill="#000" />
    </mask>
    <mask id="plus-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#fff" />
      <rect x="350" y="506" width="324" height="152" rx="60" fill="#000" />
      <rect x="436" y="420" width="152" height="324" rx="60" fill="#000" />
    </mask>
  </defs>

  <rect x="318" y="72" width="388" height="300" rx="100" fill="#03346f" mask="url(#handle-mask)" />

  <g mask="url(#plus-mask)">
    <rect x="128" y="236" width="382" height="342" rx="82" fill="#2b6fff" />
    <rect x="514" y="236" width="382" height="342" rx="82" fill="#03346f" />
    <rect x="128" y="582" width="382" height="342" rx="82" fill="#03346f" />
    <rect x="514" y="582" width="382" height="342" rx="82" fill="#ff8a00" />
  </g>
</svg>
